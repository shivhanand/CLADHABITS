<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>CLADHABITS — Activate</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#07111f;color:#f7fbff;padding:24px}
.card{width:min(460px,100%);padding:34px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(13,28,48,.94);box-shadow:0 24px 70px rgba(0,0,0,.35)}
.logo{font-weight:900;letter-spacing:.08em;font-size:22px;margin-bottom:10px}
.sub{color:#aebdce;line-height:1.55;margin-bottom:26px}
label{display:block;font-size:13px;color:#cbd7e4;margin:0 0 8px}
.field{width:100%;padding:14px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#081625;color:#fff;outline:none;margin-bottom:16px}
.field:focus{border-color:#6fa7ff}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#fff;color:#07111f;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.msg{min-height:22px;margin-top:16px;color:#aebdce;font-size:14px;line-height:1.45}
.note{margin-top:22px;font-size:12px;color:#8192a6;line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <div class="logo">CLADHABITS</div>
  <div class="sub">Activate your personal CLADHABITS access. One license is locked to one browser/device to stop normal link sharing.</div>
  <form id="form">
    <label for="license">License key</label>
    <input class="field" id="license" autocomplete="off" placeholder="CLAD-XXXX-XXXX-XXXX" required>
    <label for="email">Purchase email</label>
    <input class="field" id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <button id="btn" type="submit">Activate CLADHABITS</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="note">Your activation is stored for this browser/device. Sharing the product URL does not transfer the activation cookie.</div>
</main>
<script>
const form=document.getElementById('form');
const msg=document.getElementById('msg');
const btn=document.getElementById('btn');
const keyField=document.getElementById('license');
const API='https://glmsrbyczxikwlhxyalv.supabase.co/functions/v1/cladhabits-license-activate';

const q=new URLSearchParams(location.search);
if(q.get('key')) keyField.value=q.get('key');

function getDeviceId(){
  const storageKey='cladhabits_device_id';
  try{
    let id=localStorage.getItem(storageKey);
    if(!id){
      id=(crypto.randomUUID ? crypto.randomUUID() : 'clad-'+Date.now()+'-'+Math.random().toString(36).slice(2));
      localStorage.setItem(storageKey,id);
    }
    return id;
  }catch{
    return 'clad-session-'+navigator.userAgent.slice(0,120)+'-'+screen.width+'x'+screen.height;
  }
}

function setSessionCookie(token, expiresAt){
  const maxAge=Math.max(60, Math.floor((new Date(expiresAt).getTime()-Date.now())/1000));
  document.cookie='clad_session='+encodeURIComponent(token)+'; Path=/; Max-Age='+maxAge+'; Secure; SameSite=Lax';
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  msg.textContent='Checking your license…';
  btn.disabled=true;

  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);

  try{
    const response=await fetch(API,{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({
        license_key:keyField.value.trim(),
        email:document.getElementById('email').value.trim(),
        fingerprint:getDeviceId()
      }),
      signal:controller.signal
    });

    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data?.ok){
      const reason=data?.reason||'';
      const message =
        reason==='email_mismatch' ? 'The email does not match your purchase.' :
        reason==='activation_limit_reached' ? 'This license is already active on another device.' :
        reason==='invalid_or_expired' ? 'License not found, inactive, or expired.' :
        data?.message || 'Activation failed. Please check your details and try again.';
      throw new Error(message);
    }

    if(!data.session_token||!data.session_expires_at){
      throw new Error('Activation succeeded, but the secure access session could not be created.');
    }

    setSessionCookie(data.session_token,data.session_expires_at);
    msg.textContent='Activated. Opening your tracker…';
    setTimeout(()=>location.replace('/'),250);
  }catch(err){
    msg.textContent=err.name==='AbortError'
      ? 'The activation service took too long to respond. Please try again.'
      : (err.message||'Activation failed.');
    btn.disabled=false;
  }finally{
    clearTimeout(timeout);
  }
});
</script>
</body>
</html>
