/* ===== MONTH-SCOPE HELPERS — ALL FEATURES FOLLOW SELECTED MONTH ===== */
function selectedMonthEnd(){
  const y=cursor.getFullYear(),m=cursor.getMonth(),n=daysInMonth(y,m);
  const end=new Date(y,m,n);
  if(end>today)return new Date(today);
  return end;
}
function selectedMonthStart(){
  return new Date(cursor.getFullYear(),cursor.getMonth(),1);
}
function selectedMonthDate(d){
  return d.getFullYear()===cursor.getFullYear() && d.getMonth()===cursor.getMonth();
}
function selectedMonthDaysBack(count){
  const end=selectedMonthEnd();
  const start=selectedMonthStart();
  const arr=[];
  for(let i=count-1;i>=0;i--){
    const d=new Date(end);
    d.setDate(end.getDate()-i);
    if(d>=start)arr.push(d);
  }
  return arr;
}
function monthStreakSuccess(d){
  if(!selectedMonthDate(d))return false;
  return streakSuccess(d);
}
function monthStreakPerfect(d){
  if(!selectedMonthDate(d))return false;
  return streakPerfect(d);
}
function selectedMonthCurrentStreak(){
  if(!state.habits.length)return 0;
  let d=new Date(selectedMonthEnd()),count=0;
  if(!monthStreakSuccess(d))d.setDate(d.getDate()-1);
  while(selectedMonthDate(d)&&monthStreakSuccess(d)){
    count++;
    d.setDate(d.getDate()-1);
  }
  return count;
}
function selectedMonthBestStreak(){
  if(!state.habits.length)return 0;
  const start=selectedMonthStart(),end=selectedMonthEnd();
  let best=0,run=0;
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    if(monthStreakSuccess(d)){run++;best=Math.max(best,run)}
    else run=0;
  }
  return best;
}
function selectedMonthCurrentPerfectStreak(){
  if(!state.habits.length)return 0;
  let d=new Date(selectedMonthEnd()),count=0;
  if(!monthStreakPerfect(d))d.setDate(d.getDate()-1);
  while(selectedMonthDate(d)&&monthStreakPerfect(d)){
    count++;
    d.setDate(d.getDate()-1);
  }
  return count;
}
function selectedMonthBestPerfectStreak(){
  if(!state.habits.length)return 0;
  const start=selectedMonthStart(),end=selectedMonthEnd();
  let best=0,run=0;
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    if(monthStreakPerfect(d)){run++;best=Math.max(best,run)}
    else run=0;
  }
  return best;
}

.insight-card{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:13px;min-height:108px}
.insight-card.positive{border-color:rgba(18,183,106,.3);background:rgba(18,183,106,.045)}
.insight-card.warning{border-color:rgba(217,45,32,.24);background:rgba(217,45,32,.035)}
.insight-card.neutral{border-color:var(--line)}
.insight-icon{font-size:20px;margin-bottom:7px}
.insight-title{font-size:11px;font-weight:900}
.insight-text{font-size:10px;line-height:1.45;color:var(--muted);margin-top:5px}
.insight-metric{font-size:18px;font-weight:900;margin-top:7px}
.insights-footer{margin-top:11px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:10px;color:var(--muted)}
@media(max-width:800px){.insights-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){
 .smart-insights-card{padding:14px}
 .smart-insights-head{display:block}
 .insights-period{display:inline-block;margin-top:8px}
 .insights-grid{grid-template-columns:1fr}
}


.module-error-card{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}


.month-reset-btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  font-size:12px;
}
.month-reset-btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.12)}


/* =========================================================
   CLADHABITS V2 — FINAL RESPONSIVE / TOUCH OPTIMIZATION
   Keeps the existing visual system and feature logic intact.
   ========================================================= */
html{scroll-behavior:smooth;overflow-x:hidden}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Desktop: use the available canvas without making cards enormous. */
.shell{width:min(1250px,calc(100% - 28px));box-sizing:border-box}
.tracker{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:14px}
.tracker .grid{min-width:max-content}
.tracker .check,.tracker .head[data-calday]{min-height:42px}
.tracker .check{font-size:18px}

/* Feature sections keep their own scroll boundaries instead of pushing the page sideways. */
.progress-trend-card,.streak-center-card,.achievements-card,.smart-insights-card,.monthly-heatmap-section,.analytics-card{max-width:100%;box-sizing:border-box;overflow:hidden}
.progress-trend-card svg{max-width:100%;height:auto}
.weekly-circle-grid,.analytics-top{min-width:0}
.badge-grid{min-width:0}

/* Tablet */
@media (max-width:900px){
  .shell{width:min(100% - 24px,1250px);padding:24px 12px 84px}
  .hero{align-items:flex-start;gap:16px}
  .hero h1{font-size:28px}
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .analytics-top{grid-template-columns:1fr}
  .analytics-card{padding:16px}
  .donut-layout{min-height:0}
  .badge-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .streak-main-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .streak-hero{grid-column:1/-1}
}

/* Phone: no cramped controls, no accidental horizontal page scroll. */
@media (max-width:600px){
  .shell{width:100%;padding:16px 10px 92px}
  .hero{display:flex;flex-direction:column;align-items:stretch;margin-bottom:16px}
  .hero h1{font-size:25px;line-height:1.15}
  .dateRange{font-size:11px}
  .month-controls{width:100%;display:grid;grid-template-columns:1fr 1fr auto}
  .round-btn,.ghost-btn{min-height:44px}
  .month-reset-btn{white-space:nowrap}

  .stats-grid{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .stat{padding:13px;min-width:0}  .stat .value{font-size:22px}
  .score-card .score-wrap{gap:10px}
  .score-ring{width:68px;height:68px}
  .score-ring:before{width:48px;height:48px}
  .score-number{font-size:16px}

  .tabs{gap:2px;margin-bottom:12px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{min-height:44px;padding:11px 13px;font-size:12px}

  .panel{padding:14px;border-radius:15px}
  .panel-head{align-items:flex-start;flex-direction:column;gap:10px;margin-bottom:12px}
  .panel-head .primary-btn{align-self:flex-end;min-height:42px}

  /* Daily tracker: horizontally scroll the calendar, never the whole page. */
  .tracker{margin-inline:-2px;padding-bottom:3px}
  .tracker .grid{grid-template-columns:minmax(150px,1fr) repeat(var(--tracker-days,31),42px)!important}
  .tracker .check,.tracker .head[data-calday]{min-width:42px;min-height:44px}
  .tracker .habit-name{min-height:44px}
  .tracker .check{font-size:19px}
  .tracker-legend{flex-wrap:wrap;gap:8px}

  .analytics-top{gap:10px}
  .donut-layout{flex-direction:column;align-items:flex-start;gap:14px;padding-bottom:4px}
  .analytics-donut{width:132px;height:132px}
  .analytics-kpis{grid-template-columns:1fr 1fr}
  .daily-bars{gap:4px;height:125px}

  .weekly-circle-grid{grid-template-columns:1fr}
  .week-card{padding:14px}
  .week-circle-main{gap:12px}
  .week-progress-ring{width:78px;height:78px}
  .week-progress-ring:before{width:54px;height:54px}

  .heatmap-head{flex-direction:column}
  .heatmap-grid{min-width:520px}
  .monthly-heatmap-section{overflow-x:auto}

  .progress-trend-card,.streak-center-card,.achievements-card,.smart-insights-card{padding:14px}
  .progress-trend-head{flex-direction:column}
  .progress-trend-controls{justify-content:flex-start}
  .trend-btn{min-height:40px;padding:8px 12px}

  .streak-main-grid{grid-template-columns:1fr}
  .streak-hero{grid-column:auto}
  .streak-mini-calendar{grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .streak-habit-row{align-items:flex-start;flex-direction:column}
  .streak-habit-stats{justify-content:flex-start}

  .badge-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .badge-item{min-height:130px;padding:10px}

  .floating-add{right:14px;bottom:14px;min-height:50px;padding:0 17px;z-index:40}

  .modal{width:min(100% - 20px,520px);max-height:calc(100vh - 20px);overflow:auto}
}

@media (max-width:380px){
  .stats-grid{grid-template-columns:1fr}
  .month-controls{grid-template-columns:44px 44px 1fr}
  .badge-grid{grid-template-columns:1fr}
  .analytics-kpis{grid-template-columns:1fr}
}

/* Backup controls */
.backup-btn{min-width:72px}
@media(max-width:760px){.top-actions{gap:6px;flex-wrap:wrap}.backup-btn{min-width:64px;padding:9px 11px}}

/* Respect reduced-motion preferences. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.001ms!important;animation-duration:.001ms!important;animation-iteration-count:1!important}
}

</style>
</head>

<script>
const KEY='cladhabits-v2';const $=s=>document.querySelector(s);const today=new Date();const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);let state;try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'&&Array.isArray(saved.habits)&&saved.logs&&typeof saved.logs==='object'&&!Array.isArray(saved.logs)){state={habits:saved.habits,logs:saved.logs,theme:saved.theme==='dark'?'dark':'light'}}}catch(e){}state=state||{habits:[],logs:{},theme:'light'};let cursor=new Date(today.getFullYear(),today.getMonth(),1),activeView='tracker';
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const BACKUP_VERSION=1;
function refreshData(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw){toast('No saved data found');return;}
    const fresh=JSON.parse(raw);
    if(!fresh||typeof fresh!=='object'||!Array.isArray(fresh.habits)||!fresh.logs||typeof fresh.logs!=='object'){
      toast('Saved data is invalid');return;
    }
    state={habits:fresh.habits,logs:fresh.logs,theme:fresh.theme==='dark'?'dark':'light'};
    render();
    toast('Data refreshed');
  }catch(err){
    console.error('CLADHABITS refresh error:',err);
    toast('Could not refresh data');
  }
}

function exportBackup(){

function validateBackup(raw){

  if(!data||typeof data!=='object'||!Array.isArray(data.habits)||!data.logs||typeof data.logs!=='object'||Array.isArray(data.logs))throw new Error('Invalid backup file.');
  const habits=data.habits.map(h=>({

  })).filter(h=>h.id&&h.name);
  if(habits.length!==data.habits.length)throw new Error('Backup contains an invalid habit.');
  const ids=new Set(habits.map(h=>h.id));
  const logs={};let logCount=0;
  for(const [key,value] of Object.entries(data.logs)){
    if(typeof key!=='string')continue;
    const sep=key.indexOf('|');
    if(sep<1)throw new Error('Backup contains an invalid log key.');

}

function streakDayData(d){

  });
  const total=state.habits.length;
  const recorded=done+wrong;
  const completion=recorded?Math.round(done/recorded*100):0;

}

function achievementStats(){
  const y=cursor.getFullYear(),m=cursor.getMonth(),n=daysInMonth(y,m);
  let totalDone=0,totalWrong=0,totalRecorded=0,totalPerfect=0;

  state.habits.forEach(h=>{
    for(let day=1;day<=n;day++){
      const d=new Date(y,m,day);
      if(d>today)continue;
      const s=status(h,d);
      if(s===1)totalDone++;
      else if(s===-1)totalWrong++;
    }
  });

  totalRecorded=totalDone+totalWrong;

  // Perfect days are counted only inside the selected month.
  for(let day=1;day<=n;day++){
    const d=new Date(y,m,day);
    if(d>today)continue;
    if(streakPerfect(d))totalPerfect++;
  }

  // Longest successful/perfect streak inside the selected month.
  let bestStreak=0,run=0,bestPerfectStreak=0,perfectRun=0;
  for(let day=1;day<=n;day++){
    const d=new Date(y,m,day);
    if(d>today)break;

    if(streakSuccess(d)){run++;bestStreak=Math.max(bestStreak,run)}
    else run=0;

    if(streakPerfect(d)){perfectRun++;bestPerfectStreak=Math.max(bestPerfectStreak,perfectRun)}
    else perfectRun=0;
  }

  const monthStart=new Date(y,m,1);
  const monthEnd=new Date(y,m,n);

  let habitsCreatedThisMonth=0;
  state.habits.forEach(h=>{
    if(h.created){
      const created=new Date(h.created);
      if(created>=monthStart && created<=new Date(monthEnd.getFullYear(),monthEnd.getMonth(),monthEnd.getDate(),23,59,59)){
        habitsCreatedThisMonth++;
      }
    }
  });

  return {
    totalDone,totalWrong,totalRecorded,totalPerfect,
    bestStreak,bestPerfectStreak,habitsCreatedThisMonth
  };
}

/* ===== CLADHABITS FEATURE 7 — SMART INSIGHTS ===== */
function smartMonthData(){
  const y=cursor.getFullYear(),m=cursor.getMonth(),n=daysInMonth(y,m);
  let done=0,wrong=0,recorded=0,possible=0;
  const daily=[];
  const habitStats=[];

  state.habits.forEach(h=>{
    let hd=0,hw=0;
    for(let day=1;day<=n;day++){
      const d=new Date(y,m,day);
      if(d>today)continue;
      const s=status(h,d);
      possible++;
      if(s===1){done++;hd++}
      else if(s===-1){wrong++;hw++}
    }
    const rec=hd+hw;
    habitStats.push({h,done:hd,wrong:hw,rate:rec?Math.round(hd/rec*100):0,recorded:rec});
  });

  for(let day=1;day<=n;day++){
    const d=new Date(y,m,day);
    if(d>today)continue;
    let dd=0,dw=0,dr=0;
    state.habits.forEach(h=>{
      const s=status(h,d);
      if(s===1){dd++;dr++}
      else if(s===-1){dw++;dr++}
    });
    daily.push({date:d,done:dd,wrong:dw,recorded:dr,rate:dr?Math.round(dd/dr*100):0});
  }

  const completion=done+wrong?Math.round(done/(done+wrong)*100):0;
  const score=done+wrong?Math.round(((done-wrong)/(done+wrong)*50)+50):0;
  const activeDays=daily.filter(x=>x.recorded>0).length;
  const avgDaily=activeDays?Math.round(daily.filter(x=>x.recorded>0).reduce((a,x)=>a+x.rate,0)/activeDays):0;

  return {done,wrong,recorded,possible,completion,score,activeDays,avgDaily,daily,habitStats};
}
function smartTrendDirection(data){
  const active=data.daily.filter(x=>x.recorded>0);
  if(active.length<4)return null;
  const half=Math.max(2,Math.floor(active.length/2));
  const a=active.slice(0,half),b=active.slice(-half);
  const av=a.reduce((s,x)=>s+x.rate,0)/a.length;
  const bv=b.reduce((s,x)=>s+x.rate,0)/b.length;
  return {delta:Math.round(bv-av),from:Math.round(av),to:Math.round(bv)};
}

function habits(){
 const y=cursor.getFullYear(),m=cursor.getMonth(),n=daysInMonth(y,m);
 const rows=state.habits.map(h=>{let d=0,w=0,b=0;for(let day=1;day<=n;day++){const st=status(h,new Date(y,m,day));if(st===1)d++;else if(st===-1)w++;else b++;}const recorded=d+w,p=recorded?Math.round(d/recorded*100):0;return `<div class="habit-row"><div><strong>${esc(h.name)}</strong><div class="muted">${esc(h.category)} · ${h.mode==='avoid'?'Not Do':'Do'} · ${h.target} days/week</div></div><span class="pill">${p}% · ${d} done</span><span class="muted">✕ ${w} wrong · ○ ${b} blank</span><button class="danger" data-del="${h.id}">Delete</button></div>`}).join('');
 $('#view-habits').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>Habit Analysis</h2><div class="muted">Analysis for ${cursor.toLocaleString(undefined,{month:'long',year:'numeric'})}.</div></div><button class="primary-btn" id="analysisAdd">+ Habit</button></div><div class="rows">${rows||'<div class="empty">No habits yet.</div>'}</div></div>`;
 $('#analysisAdd').onclick=openModal;
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this habit and its history?')){state.habits=state.habits.filter(h=>h.id!==b.dataset.del);Object.keys(state.logs).forEach(k=>{if(k.startsWith(b.dataset.del+'|'))delete state.logs[k]});save();render()}});
}

function tracker(){
 const y=cursor.getFullYear(),m=cursor.getMonth(),n=daysInMonth(y,m);
 let selectedDay=null;

 const heads='<div class="head" style="cursor:default"><span class="dow">Habit</span><span class="date-num">Calendar</span></div>'+
 Array.from({length:n},(_,i)=>{
   const d=new Date(y,m,i+1),dow=d.toLocaleDateString(undefined,{weekday:'short'}),
   isToday=sameDay(d,today),isWeekend=d.getDay()===0||d.getDay()===6;
   return `<button type="button" class="head ${isToday?'today':''} ${isWeekend?'weekend':''}" data-calday="${i+1}" aria-label="${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}"><span class="dow">${dow}</span><span class="date-num">${i+1}</span></button>`;
 }).join('');

 const rows=state.habits.map(h=>
   `<div class="habit-name"><span class="dot"></span><div><div>${esc(h.name)}</div><small class="muted">${h.mode==='avoid'?'Not Do':'Do'}</small></div></div>`+
   Array.from({length:n},(_,i)=>{
     const d=new Date(y,m,i+1),st=status(h,d);
     return `<button type="button" class="check ${st===1?'done':st===-1?'wrong':''} ${future(d)?'future':''}" data-h="${h.id}" data-day="${i+1}" aria-label="${esc(h.name)} on ${d.toLocaleDateString(undefined,{month:'long',day:'numeric'})}" aria-pressed="${st===1}">${st===1?'✓':st===-1?'✕':''}</button>`;
   }).join('')
 ).join('');

 $('#view-tracker').innerHTML=`
 <div class="panel">
   <div class="panel-head"><div>
     <h2>Daily Tracker</h2>
     <div class="muted">Calendar view · tap a date above to highlight it.</div>
     <div class="calendar-hint" id="calendarHint">Select any date to focus on that day.</div>
     <div class="tracker-legend">
       <span class="legend-item"><span class="legend-dot good">✓</span> Done</span>
       <span class="legend-item"><span class="legend-dot bad">✕</span> Wrong</span>
       <span class="legend-item"><span class="legend-dot empty"></span> Clear</span>
     </div>
   </div><button class="primary-btn" id="quickAdd">+ Habit</button></div>
   <div class="tracker" style="--tracker-days:${n}"><div class="grid" style="grid-template-columns:minmax(150px,1fr) repeat(${n},42px);min-width:${150+n*42}px">
     ${heads}${rows||'<div class="empty" style="grid-column:1/-1">Add your first habit with the button below.</div>'}
   </div></div>
 </div>
 <div id="dailyWeeklyMount"></div> <div id="progressTrendMount" class="progress-trend-section" data-range="30d" data-metric="both"></div>
 <div id="streakCenterMount" class="streak-center-section"></div>
 <div id="achievementsMount" class="achievements-section"></div>
 <div id="smartInsightsMount" class="smart-insights-section"></div>`;

 // Render each enhancement independently so one broken module can never hide
 // the tracker itself.
 const safeMount=(selector,fn)=>{
   const el=$(selector);
   if(!el)return;
   try{
     const html=fn();
     if(typeof html==='string')el.innerHTML=html;
   }catch(err){
     console.error('CLADHABITS module error:',selector,err);
     el.innerHTML='<div class="panel" style="margin-top:12px"><strong>Module temporarily unavailable</strong><div class="muted">Your tracker data is safe. Refresh after reopening the file.</div></div>';
   }
 };
 safeMount('#dailyWeeklyMount',dailyWeeklyBoards);
 try{progressTrend()}catch(err){console.error('Progress Trend:',err)}
 try{streakCenter()}catch(err){console.error('Streak Center:',err)}
 try{achievements()}catch(err){console.error('Achievements:',err)}
 try{smartInsights()}catch(err){console.error('Smart Insights:',err)}

 const trackerEl=$('#view-tracker');
 const timers=new Map(),pending=new Map();

 const handleTap=(b)=>{
   const h=getHabit(b.dataset.h),d=new Date(y,m,Number(b.dataset.day));
   if(!h)return;
   const key=h.id+'|'+iso(d),now=Date.now(),last=pending.get(key)||0;
   if(now-last<320){
     clearTimeout(timers.get(key));pending.delete(key);
     setStatus(h,d,status(h,d)===-1?0:-1);updateCheckButton(b,h,d);return;
   }
   pending.set(key,now);
   timers.set(key,setTimeout(()=>{
     if(pending.get(key)!==now)return;
     pending.delete(key);
     setStatus(h,d,status(h,d)===1?0:1);updateCheckButton(b,h,d);
   },320));
 };

 const updateCheckButton=(b,h,d)=>{
   const st=status(h,d);
   b.classList.toggle('done',st===1);b.classList.toggle('wrong',st===-1);
   b.textContent=st===1?'✓':st===-1?'✕':'';
   b.setAttribute('aria-pressed',st===1?'true':'false');
   renderStats();
   if(activeView==='tracker'){
     try{progressTrend()}catch(e){}
     try{streakCenter()}catch(e){}
     try{achievements()}catch(e){}
     try{smartInsights()}catch(e){}
   }
   if(activeView==='analytics')try{analytics()}catch(e){}
 };

 trackerEl.onpointerup=(e)=>{
   const b=e.target.closest('.check');
   if(!b||!trackerEl.contains(b))return;
   e.preventDefault();handleTap(b);
 };

 trackerEl.querySelectorAll('[data-calday]').forEach(btn=>btn.onclick=()=>{
   selectedDay=Number(btn.dataset.calday);
   trackerEl.querySelectorAll('[data-calday]').forEach(x=>x.classList.toggle('selected',x===btn));
   const d=new Date(y,m,selectedDay);
   $('#calendarHint').innerHTML=`Selected: <span class="calendar-selected">${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</span>`;
   const target=trackerEl.querySelector(`.grid .check[data-day="${selectedDay}"]`);
   if(target)target.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
 });

 $('#quickAdd').onclick=openModal;
}

function analytics(){
 const y=cursor.getFullYear(),m=cursor.getMonth(),n=daysInMonth(y,m);
 if(!state.habits.length){$('#view-analytics').innerHTML='<div class="analytics-card analytics-empty">Add your first habit to start building your analytics.</div>';return}
 let doneCount=0,wrongCount=0,blankCount=0,total=0;
 state.habits.forEach(h=>{for(let day=1;day<=n;day++){const d=new Date(y,m,day);if(!selectedDateIsInScope(d))continue;total++;const s=status(h,d);if(s===1)doneCount++;else if(s===-1)wrongCount++;else blankCount++;}});
 const recorded=doneCount+wrongCount, completion=total?Math.round(doneCount/total*100):0, clad=recorded?Math.round(((doneCount-wrongCount)/recorded*50)+50):0;
 const goodDeg=total?doneCount/total*360:0, badDeg=total?wrongCount/total*360:0;
 const donutStyle=total?`background:conic-gradient(var(--good) 0deg ${goodDeg}deg,var(--danger) ${goodDeg}deg ${goodDeg+badDeg}deg,var(--line) ${goodDeg+badDeg}deg 360deg)`:'';
 const habitRows=state.habits.map(h=>{
   let d=0,w=0,b=0;
   for(let day=1;day<=n;day++){const dt=new Date(y,m,day);if(!selectedDateIsInScope(dt))continue;const st=status(h,dt);if(st===1)d++;else if(st===-1)w++;else b++;}
   const denom=d+w+b, pct=denom?Math.round(d/denom*100):0;
   return {h,d,w,b,pct};
 }).sort((a,b)=>b.pct-a.pct).map(x=>`<div class="performance-row"><div class="performance-name" title="${esc(x.h.name)}">${esc(x.h.name)}</div><div class="performance-bar"><i style="width:${x.pct}%"></i></div><div class="performance-pct">${x.pct}%</div></div>`).join('');

 // Build real calendar weeks: Monday-Sunday, with every week getting its own
 // circular progress board and the same reference-inspired color sequence.
 const first=new Date(y,m,1);
 const startOffset=(first.getDay()+6)%7;
 const weekStart=1-startOffset;
 const weekCards=[];
 for(let w=0;w<6;w++){
   const startDay=weekStart+(w*7);
   const endDay=startDay+6;
   if(startDay>n && w>=5) continue;
   let dCount=0,wCount=0,bCount=0,totalChecks=0;
   const mini=[];
   for(let k=0;k<7;k++){
     const dayNum=startDay+k;
     if(dayNum<1||dayNum>n){
       mini.push(`<div class="week-mini-day"><div>—</div><div class="week-mini-dot future"></div></div>`);
       continue;
     }
     const dt=new Date(y,m,dayNum);
     const dow=dt.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2);
     let dayDone=0,dayWrong=0,dayTracked=0;
     state.habits.forEach(h=>{
       if(selectedDateIsInScope(dt)){
         const st=status(h,dt);
         dayTracked++;
         if(st===1){dCount++;dayDone++}
         else if(st===-1){wCount++;dayWrong++}
         else bCount++;
       }
     });
     totalChecks+=dayTracked;
     const mark=dayDone>0&&dayWrong===0?'✓':dayWrong>0&&dayDone===0?'✕':dayDone>0?'•':'';
     const cls=dayDone>0&&dayWrong===0?'done':dayWrong>0?'wrong':'';
     mini.push(`<div class="week-mini-day"><div>${dow}</div><div class="week-mini-dot ${cls}">${mark}</div><div>${dayNum}</div></div>`);
   }
   const pct=totalChecks?Math.round(dCount/totalChecks*100):0;
   const startDate=new Date(y,m,Math.max(1,startDay));
   const endDate=new Date(y,m,Math.min(n,endDay));
   const range=startDate.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+endDate.toLocaleDateString(undefined,{month:'short',day:'numeric'});
   const weekClass=`w${Math.min(w+1,6)}`;
   weekCards.push(`<div class="week-circle-card ${weekClass}" style="--p:${pct*3.6}deg">
     <div class="week-circle-head"><div><div class="week-circle-title">Week ${w+1}</div><div class="week-circle-range">${range}</div></div><span class="pill">${dCount} done</span></div>
     <div class="week-circle-main">
       <div class="week-progress-ring"><div class="week-progress-center"><strong>${pct}%</strong><span>progress</span></div></div>
       <div class="week-mini-grid">${mini.join('')}</div>
     </div>
     <div class="week-result-line"><strong>✓ ${dCount}</strong> done · <strong>✕ ${wCount}</strong> wrong · ${bCount} unmarked</div>
     <div class="week-color-bar"></div>
   </div>`);
 }
 const recent=[];const recentEnd=selectedDataEnd();for(let i=6;i>=0;i--){const dt=new Date(recentEnd);dt.setDate(recentEnd.getDate()-i);let d=0,t=0;state.habits.forEach(h=>{t++;if(done(h,dt))d++;});recent.push({dt,pct:t?Math.round(d/t*100):0});}

 $('#view-analytics').innerHTML=`<div class="analytics-top">
 <div class="analytics-card"><div class="panel-head"><div><h2>Monthly Analytics</h2><div class="muted">${cursor.toLocaleString(undefined,{month:'long',year:'numeric'})} · all tracked habits</div></div></div>
 <div class="donut-layout"><div class="analytics-donut" style="${donutStyle}"><div class="analytics-donut-center"><strong>${completion}%</strong><span>completion</span></div></div><div class="analytics-legend"><div class="analytics-legend-row"><span class="analytics-legend-label"><i class="analytics-dot good"></i> Done</span><strong>${doneCount}</strong></div><div class="analytics-legend-row"><span class="analytics-legend-label"><i class="analytics-dot bad"></i> Wrong</span><strong>${wrongCount}</strong></div><div class="analytics-legend-row"><span class="analytics-legend-label"><i class="analytics-dot empty"></i> Unmarked</span><strong>${blankCount}</strong></div></div></div>
 <div class="analytics-kpis"><div class="analytics-kpi"><strong>${clad}/100</strong><span>CLAD Score</span></div><div class="analytics-kpi"><strong>${recorded}</strong><span>Recorded check-ins</span></div></div></div>
 <div class="analytics-card"><div class="panel-head"><div><h2>Week-by-Week Progress</h2><div class="muted">Every calendar week has its own circular progress board. ✓ done · ✕ wrong · blank is neutral.</div></div></div>
 <div class="weekly-circle-grid">${weekCards.join('')}</div>
 <div class="analytics-section"><h3>Last 7 Days</h3><div class="muted">Daily completion trend</div><div class="daily-bars">${recent.map(x=>`<div class="daily-bar-col"><div class="daily-bar-pct">${x.pct}%</div><div class="daily-bar" style="height:${Math.max(3,x.pct)}%"></div><div class="daily-bar-label">${x.dt.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)}</div></div>`).join('')}</div></div></div>
 </div>
 <div class="analytics-card"><div class="panel-head"><div><h2>Habit Performance</h2><div class="muted">Done rate for each habit. Wrong and unmarked results remain visible in the tracker.</div></div></div><div class="performance-list">${habitRows||'<div class="analytics-empty">No habit data yet.</div>'}</div></div>${monthlyHeatmap()}`;
}

document.addEventListener('click',e=>{
 const cell=e.target.closest?.('[data-heat-date]');
 if(cell)updateHeatDetail(cell.dataset.heatDate);
});

document.addEventListener('click',e=>{
 const cell=e.target.closest?.('[data-heat-date]');
 if(cell)updateHeatDetail(cell.dataset.heatDate);
});

function openModal(){$('#modalBackdrop').classList.remove('hidden');$('#habitName').focus()}function closeModal(){$('#modalBackdrop').classList.add('hidden');$('#habitForm').reset();$('#habitMode').value='do'}function toast(msg){const t=$('#toast');t.textContent=msg;t.style.cssText='position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 15px;border-radius:10px;z-index:50;opacity:1';setTimeout(()=>t.style.opacity=0,1800)}
$('#exportBtn').onclick=exportBackup;$('#importBtn').onclick=()=>$('#importFile').click();$('#refreshDataBtn').onclick=refreshData;$('#importFile').onchange=e=>importBackupFile(e.target.files?.[0]);$('#prevMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};
$('#nextMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};
$('#resetMonthBtn')?.addEventListener('click',resetSelectedMonth);
$('#todayBtn').onclick=()=>{cursor=new Date(today.getFullYear(),today.getMonth(),1);render()};$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();render()};$('#addHabitBtn').onclick=openModal;$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{activeView=t.dataset.view;renderViews()});$('#habitForm').onsubmit=e=>{e.preventDefault();const name=$('#habitName').value.trim();if(!name)return;state.habits.push({id:id(),name,category:$('#habitCategory').value,mode:$('#habitMode').value,target:+$('#habitTarget').value,created:new Date().toISOString()});save();closeModal();toast('Habit created');render()};render();

let cladResizeTimer; window.addEventListener('resize',()=>{clearTimeout(cladResizeTimer);cladResizeTimer=setTimeout(()=>{if(activeView==='tracker')try{progressTrend();streakCenter();achievements();smartInsights()}catch(e){}},120)},{passive:true});
</script>
</body></html>
